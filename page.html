<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" id="metaDesc" content="">
<title id="pageTitle">Ahmed Omani</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0B0B0C; --bg2:#0F0F11; --bg3:#131316;
  --line:#1E1E22; --line2:#2A2A30;
  --red:#E8192C; --red-d:#B5101E;
  --txt:#EFEFF1; --txt2:#A2A2AA; --txt3:#5E5E66;
  --wa:#25D366;
  --font:'Noto Kufi Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --pad:clamp(20px,4vw,64px);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--txt);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--red);color:#fff}
.container{max-width:1180px;margin:0 auto;padding:0 var(--pad);width:100%}

/* NAV */
nav{position:fixed;top:0;width:100%;z-index:200;height:68px;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between;background:rgba(11,11,12,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.logo-wrap{display:flex;align-items:center;gap:12px}
.logo-img{height:34px;width:34px;object-fit:contain}
.logo-text .name{font-size:13px;font-weight:900;letter-spacing:.5px;line-height:1.2}
.logo-text .sub{font-family:var(--mono);font-size:8px;color:var(--red);font-weight:600;letter-spacing:3px;text-transform:uppercase}
.nav-home{font-family:var(--mono);color:var(--txt2);font-size:11px;font-weight:600;letter-spacing:1px;transition:.2s;padding:10px 18px;border:1px solid var(--line2);text-transform:uppercase}
.nav-home:hover{color:#fff;background:var(--red);border-color:var(--red)}

/* LOADING */
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:22px}
.spin{width:36px;height:36px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:var(--mono);color:var(--txt3);font-size:11px;letter-spacing:2px}

/* 404 */
.page-404{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;gap:18px;padding:0 5%}
.err-code{font-family:var(--mono);font-size:clamp(80px,14vw,140px);font-weight:600;color:transparent;-webkit-text-stroke:1.5px var(--red);line-height:1}
.err-title{font-size:22px;font-weight:800}
.err-sub{font-size:13px;color:var(--txt3);margin-bottom:8px}
.btn-back{background:var(--red);color:#fff;padding:14px 32px;font-weight:800;font-size:14px;transition:.2s;display:inline-block}
.btn-back:hover{background:var(--red-d)}

/* SECTION: HERO */
.sec-hero{min-height:72vh;display:flex;align-items:flex-end;padding:130px 0 0;position:relative;overflow:hidden}
.sec-hero-bg{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:120px 120px;opacity:.22;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 30%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse 90% 80% at 50% 30%,#000 30%,transparent 75%)}
.sec-hero-content{position:relative;z-index:1;width:100%;padding-bottom:clamp(40px,7vh,72px)}
.sec-hero-badge{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);border:1px solid var(--line2);color:var(--txt2);padding:8px 16px;font-size:10px;font-weight:500;letter-spacing:1.5px;margin-bottom:28px}
.sec-hero-badge::before{content:'';width:7px;height:7px;background:var(--red);display:inline-block}
.sec-hero h1{font-size:clamp(34px,6vw,76px);font-weight:900;line-height:1.12;letter-spacing:-.01em;margin-bottom:20px;max-width:20ch}
.sec-hero p{font-size:15px;color:var(--txt2);max-width:520px;margin-bottom:36px;line-height:2;border-right:2px solid var(--red);padding-right:18px}
.sec-hero .btn-r{background:var(--red);color:#fff;padding:16px 34px;font-weight:800;font-size:14px;transition:.2s;display:inline-block}
.sec-hero .btn-r:hover{background:var(--red-d)}
.sec-hero-rule{border-top:1px solid var(--line);width:100%}

/* SECTION: TEXT */
.sec-text{padding:clamp(56px,8vw,96px) 0}
.sec-text-inner{max-width:800px}
.sec-text h2{font-size:clamp(26px,4vw,44px);font-weight:900;line-height:1.2}
.sec-text h2::before{content:'—';font-family:var(--mono);color:var(--red);display:block;font-size:16px;margin-bottom:14px}
.sec-text .body-content{font-size:15px;color:var(--txt2);line-height:2.1;margin-top:24px}
.sec-text .body-content p{margin-bottom:16px}
.sec-text .body-content h3{font-size:18px;font-weight:800;color:var(--txt);margin:28px 0 12px}
.sec-text .body-content ul{margin:0 22px 16px;color:var(--txt2)}
.sec-text .body-content li{margin-bottom:8px}
.sec-text .body-content strong{color:var(--txt)}

/* SECTION: CTA */
.sec-cta{padding:clamp(56px,8vw,96px) 0;background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-cta-inner{border:1px solid var(--line);border-right:3px solid var(--red);padding:clamp(32px,5vw,64px);max-width:820px;background:var(--bg)}
.sec-cta h2{font-size:clamp(26px,4vw,42px);font-weight:900;margin-bottom:14px;line-height:1.2}
.sec-cta p{font-size:14px;color:var(--txt2);margin-bottom:32px;line-height:1.9;max-width:520px}
.sec-cta-btns{display:flex;flex-wrap:wrap}
.btn-r{background:var(--red);color:#fff;padding:15px 30px;font-weight:800;font-size:14px;transition:.2s;display:inline-block;border:none;cursor:pointer;font-family:var(--font)}
.btn-r:hover{background:var(--red-d)}
.btn-wa{background:transparent;color:var(--txt);border:1px solid var(--line2);border-right:none;padding:15px 30px;font-weight:700;font-size:14px;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-wa:hover{border-color:var(--wa);color:var(--wa)}

/* FOOTER */
footer{border-top:1px solid var(--line);padding:26px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:auto}
.ft-copy{font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.5px}
.ft-mark{font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:2px}
</style>
</head>
<body>

<nav>
  <a href="/" class="logo-wrap">
    <img src="assets/logo.svg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27%23E8192C%27/%3E%3Cpolygon points=%2750,22 78,68 22,68%27 fill=%27white%27/%3E%3C/svg%3E'" alt="Ahmed Omani Logo" class="logo-img">
    <div class="logo-text">
      <div class="name">AHMED OMANI</div>
      <div class="sub">Auto Marketing</div>
    </div>
  </a>
  <a href="/" class="nav-home">← HOME</a>
</nav>

<div id="pageRoot" style="padding-top:68px">
  <div class="page-loading" id="loadingEl">
    <div class="spin"></div>
    <div class="loading-text">LOADING…</div>
  </div>
</div>

<footer>
  <div class="ft-copy">© 2025 Ahmed Omani Auto Marketing. جميع الحقوق محفوظة.</div>
  <div class="ft-mark" dir="ltr">CAIRO — EGYPT · EST. 2015</div>
</footer>

<script>
var SB_URL='https://knwnviglquxvvwknxbqa.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtud252aWdscXV4dnZ3a254YnFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MzI2NDIsImV4cCI6MjA5NjUwODY0Mn0.VuxAC-J7it4m_wrSTBHCh7t_z_PL8CCGwhvtv6NiZmQ';
var _waNum='201152501056';

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function show404(){
  document.getElementById('pageRoot').innerHTML=
    '<div class="page-404">'
    +'<div class="err-code">404</div>'
    +'<div class="err-title">الصفحة غير موجودة</div>'
    +'<div class="err-sub">الصفحة المطلوبة غير موجودة أو غير منشورة بعد</div>'
    +'<a href="/" class="btn-back">← عودة للرئيسية</a>'
    +'</div>';
  document.title='404 — Ahmed Omani';
}

function renderSection(sec){
  switch(sec.type){
    case 'hero': return renderHeroSec(sec);
    case 'text': return renderTextSec(sec);
    case 'cta':  return renderCtaSec(sec);
    default: return '';
  }
}

function renderHeroSec(s){
  var d=s.data||s;
  var btnHref=d.btn_href||d.btn_link||'';
  var badge=d.badge?'<div class="sec-hero-badge">'+esc(d.badge)+'</div>':'';
  var subtitle=d.subtitle?'<p>'+esc(d.subtitle)+'</p>':'';
  var btnHtml='';
  if(d.btn_text&&btnHref){
    var href=esc(btnHref==='whatsapp'?'https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار'):btnHref);
    btnHtml='<a href="'+href+'" class="btn-r"'+(btnHref.startsWith('http')?' target="_blank" rel="noopener"':'')+'>'
      +esc(d.btn_text)+'</a>';
  }
  return'<section class="sec-hero">'
    +'<div class="sec-hero-bg"></div>'
    +'<div class="container"><div class="sec-hero-content">'
    +badge
    +'<h1>'+esc(d.title||'')+'</h1>'
    +subtitle
    +btnHtml
    +'</div></div>'
    +'<div class="sec-hero-rule"></div>'
    +'</section>';
}

function renderTextSec(s){
  var d=s.data||s;
  return'<section class="sec-text">'
    +'<div class="container"><div class="sec-text-inner">'
    +(d.title?'<h2>'+esc(d.title)+'</h2>':'')
    +'<div class="body-content">'+parseBody(d.body||d.content||'')+'</div>'
    +'</div></div></section>';
}

function renderCtaSec(s){
  var d=s.data||s;
  var btnHref=d.btn_href||d.btn_link||'';
  var waBtn='<a href="https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار')+'" class="btn-wa" target="_blank" rel="noopener">واتساب مباشر</a>';
  var mainBtn='';
  if(d.btn_text&&btnHref){
    var href=esc(btnHref==='whatsapp'?'https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار'):btnHref);
    mainBtn='<a href="'+href+'" class="btn-r"'+(btnHref.startsWith('http')?' target="_blank" rel="noopener"':'')+'>'
      +esc(d.btn_text)+'</a>';
  }
  return'<section class="sec-cta">'
    +'<div class="container"><div class="sec-cta-inner">'
    +(d.title?'<h2>'+esc(d.title)+'</h2>':'')
    +(d.subtitle?'<p>'+esc(d.subtitle)+'</p>':'')
    +'<div class="sec-cta-btns">'+(mainBtn||'<a href="/" class="btn-r">اكتشف خدماتنا</a>')+waBtn+'</div>'
    +'</div></div></section>';
}

function parseBody(body){
  if(!body)return'';
  if(body.trim().startsWith('<'))return body;
  return body.split(/\n\n+/).map(function(p){
    return'<p>'+esc(p.trim()).replace(/\n/g,'<br>')+'</p>';
  }).join('');
}

async function loadPage(){
  var params=new URLSearchParams(window.location.search);
  var slug=params.get('slug');
  if(!slug){show404();return;}

  try{
    if(typeof supabase==='undefined'){show404();return;}
    var sb=supabase.createClient(SB_URL,SB_KEY);

    var cfg=(await sb.from('ao_settings').select('whatsapp').single()).data;
    if(cfg&&cfg.whatsapp)_waNum=cfg.whatsapp;

    var res=await sb.from('ao_pages').select('*').eq('slug',slug).eq('is_published',true).single();
    var pg=res.data;
    if(!pg){show404();return;}

    document.title=pg.title+' — Ahmed Omani';
    document.getElementById('pageTitle').textContent=pg.title+' — Ahmed Omani';
    if(pg.meta_description)document.getElementById('metaDesc').content=pg.meta_description;

    var sections=(pg.sections||[]).map(renderSection).join('');
    document.getElementById('pageRoot').innerHTML=sections||'<div style="padding:140px 5%;text-align:center;color:#5E5E66;letter-spacing:2px">لا يوجد محتوى بعد</div>';

  }catch(e){
    show404();
  }
}

document.addEventListener('DOMContentLoaded',loadPage);
</script>
</body>
</html>
