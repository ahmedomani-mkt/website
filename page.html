<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" id="metaDesc" content="">
<title id="pageTitle">Ahmed Omani</title>
<link rel="icon" href="assets/logo.png" type="image/png" id="faviconLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --p1:#0B0B0C; --p2:#141416; --p3:#1A1A1D;
  --ink:#F5F5F2; --ink2:rgba(245,245,242,.64); --ink3:rgba(245,245,242,.42);
  --line:rgba(245,245,242,.14); --line2:rgba(245,245,242,.24);
  --red-rgb:232,25,44; --red:#E8192C; --red-d:#c21322; --red-soft:rgba(232,25,44,.14);
  --wa:#25D366; --wa-d:#1dba58;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --font-display:'Big Shoulders Display','Archivo',sans-serif;
  --font-lat:'Archivo','Segoe UI',sans-serif;
  --r:2px; --rs:2px; --rp:2px;
  --pad:clamp(20px,5vw,64px);
  --nav-bg:rgba(11,11,12,.94);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--p1);color:var(--ink);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;font-weight:400;line-height:1.5}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--red);color:#fff}
.container{max-width:1180px;margin:0 auto;padding:0 var(--pad);width:100%}
.bi{line-height:1}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.eyebrow::before{content:'';width:22px;height:1.5px;background:var(--red)}

/* NAV — minimal, always-solid (no hero behind it to float over on this page) */
nav{position:fixed;top:0;left:0;right:0;z-index:500;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);background:var(--nav-bg);border-bottom:1px solid var(--line)}
.logo-wrap{display:flex;align-items:center}
.logo-img{height:30px;width:auto;max-width:160px;object-fit:contain}
.nav-links{display:none;gap:4px;list-style:none}
.nav-links a{display:block;color:var(--ink2);font-size:14px;font-weight:500;transition:.2s;padding:10px 14px;white-space:nowrap}
.nav-links a:hover,.nav-links a.active{color:var(--ink)}
.nav-cta{display:none;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line2);padding:10px 20px;border-radius:var(--rs);transition:.2s}
.nav-cta:hover{border-color:var(--red);color:var(--red)}
.burger{display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:6px;background:none;border:none;z-index:460}
.burger span{width:22px;height:1.5px;background:var(--ink);transition:.3s;display:block}
.burger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:rotate(-45deg) translate(6px,-6px)}
.mobile-nav{position:fixed;inset:0;background:var(--p1);z-index:450;display:flex;flex-direction:column;justify-content:center;padding:100px var(--pad) 40px;opacity:0;pointer-events:none;transition:opacity .3s cubic-bezier(.16,1,.3,1)}
.mobile-nav.open{opacity:1;pointer-events:all}
.mobile-nav ul{list-style:none}
.mobile-nav ul li a{display:block;padding:16px 2px;font-size:24px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line);transition:.2s}
.mobile-nav ul li a:active,.mobile-nav ul li a:hover{color:var(--red)}
.m-cta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:28px;background:var(--red);color:#fff;padding:16px;border-radius:var(--rs);font-weight:600;font-size:15px}
@media(min-width:900px){
  .nav-links{display:flex}
  .nav-cta{display:flex}
  .burger{display:none}
}

/* LOADING */
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:20px}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--ink3);font-size:13px}

/* 404 */
.page-404{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;gap:16px;padding:0 5%}
.err-code{font-size:clamp(64px,12vw,110px);font-weight:800;color:var(--red);line-height:1;letter-spacing:-.02em}
.err-title{font-size:20px;font-weight:700;color:var(--ink)}
.err-sub{font-size:13px;color:var(--ink3);margin-bottom:8px}
.btn-back{background:var(--red);color:#fff;padding:15px 32px;border-radius:var(--rs);font-weight:600;font-size:14px;transition:.2s;display:inline-block}
.btn-back:hover{background:var(--red-d);transform:translateY(-2px)}

/* SECTION: HERO — right-aligned editorial statement, no glow/card */
.sec-hero{padding:130px 0 64px;text-align:right}
.sec-hero-content{max-width:720px;margin:0 0 0 auto}
.sec-hero-badge{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:22px}
.sec-hero-badge::before{content:'';width:22px;height:1.5px;background:var(--red)}
.sec-hero-badge-dot{display:none}
.sec-hero h1{font-size:clamp(30px,6.4vw,58px);font-weight:700;line-height:1.2;letter-spacing:-.02em;margin-bottom:20px;color:var(--ink)}
.sec-hero p{font-size:15px;color:var(--ink2);line-height:1.8;max-width:480px;margin:0 0 32px auto;font-weight:400}
.sec-hero .btn-r{background:var(--red);color:#fff;padding:15px 28px;border-radius:var(--rs);font-weight:600;font-size:14.5px;transition:.2s;display:inline-flex;align-items:center;gap:9px}
.sec-hero .btn-r:hover{background:var(--red-d);transform:translateY(-2px)}

/* SECTION: TEXT — hairline surface, no card shadow */
.sec-text{padding:clamp(40px,6vw,64px) 0}
.sec-text-inner{max-width:760px;margin:0 auto;background:var(--p2);border:1px solid var(--line);border-radius:var(--r);padding:clamp(28px,4.5vw,48px)}
.sec-text-kicker{width:22px;height:1.5px;background:var(--red);margin-bottom:16px}
.sec-text h2{font-size:clamp(22px,3.5vw,30px);font-weight:700;line-height:1.3;margin-bottom:18px;color:var(--ink);letter-spacing:-.01em}
.sec-text .body-content{font-size:15px;color:var(--ink2);line-height:1.95}
.sec-text .body-content p{margin-bottom:16px}
.sec-text .body-content p:last-child{margin-bottom:0}
.sec-text .body-content h3{font-size:16px;font-weight:700;color:var(--ink);margin:26px 0 10px}
.sec-text .body-content ul{margin:0 22px 16px;color:var(--ink2)}
.sec-text .body-content li{margin-bottom:8px}
.sec-text .body-content strong{color:var(--ink);font-weight:700}

/* SECTION: CTA — hairline surface, no gradient */
.sec-cta{padding:clamp(40px,6vw,64px) 0}
.sec-cta-inner{background:var(--p2);border:1px solid var(--line);border-radius:var(--r);padding:clamp(32px,5.5vw,52px);max-width:720px;margin:0 auto;text-align:center}
.sec-cta h2{font-size:clamp(22px,3.5vw,30px);font-weight:700;margin-bottom:12px;line-height:1.3;color:var(--ink);letter-spacing:-.01em}
.sec-cta p{font-size:14px;color:var(--ink2);margin-bottom:30px;line-height:1.8}
.sec-cta-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn-r{background:var(--red);color:#fff;padding:15px 28px;border-radius:var(--rs);font-weight:600;font-size:14px;transition:.2s;display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:var(--font)}
.btn-r:hover{background:var(--red-d);transform:translateY(-2px)}
.btn-wa{background:transparent;color:var(--ink);border:1px solid var(--line2);padding:15px 28px;border-radius:var(--rs);font-weight:600;font-size:14px;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-wa:hover{border-color:var(--red);color:var(--red)}

/* FOOTER */
footer{border-top:1px solid var(--line);padding:24px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:auto;background:var(--p1)}
.ft-copy{font-size:13px;color:var(--ink3)}
.ft-mark{font-size:13px;color:var(--ink3)}

/* ══ MOTION — same reveal engine as index.html ══ */
.fade-up{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.fade-up.visible{opacity:1;transform:translateY(0)}
@media(prefers-reduced-motion:reduce){.fade-up{opacity:1;transform:none;transition:none}}

@media(max-width:640px){
  footer{justify-content:center;text-align:center}
}
</style>
</head>
<body>

<nav id="mainNav">
  <a href="https://wa.me/201152501056?text=مرحبا،%20أريد%20الاستفسار%20عن%20خدماتكم" class="nav-cta" id="navCta" target="_blank" rel="noopener">يلا نتكلم</a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html#portfolio">أعمالنا</a></li>
    <li><a href="index.html#services">خدماتنا</a></li>
    <li><a href="index.html#intro">نبذة عنا</a></li>
    <li><a href="catalog.html">الكتالوج</a></li>
  </ul>
  <button class="burger" id="burger" onclick="toggleMenu()" aria-label="القائمة">
    <span></span><span></span><span></span>
  </button>
  <a href="index.html" class="logo-wrap">
    <img id="navLogoImg" src="assets/logo.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27%23E8192C%27/%3E%3Cpolygon points=%2750,22 78,68 22,68%27 fill=%27white%27/%3E%3C/svg%3E'" alt="Ahmed Omani Auto Marketing" class="logo-img">
  </a>
</nav>

<div class="mobile-nav" id="mobileNav">
  <ul>
    <li><a href="index.html" onclick="closeMenu()">الرئيسية</a></li>
    <li><a href="index.html#portfolio" onclick="closeMenu()">أعمالنا</a></li>
    <li><a href="index.html#services" onclick="closeMenu()">خدماتنا</a></li>
    <li><a href="catalog.html" onclick="closeMenu()">الكتالوج</a></li>
    <li><a href="index.html#clients" onclick="closeMenu()">عملاؤنا</a></li>
  </ul>
  <a href="https://wa.me/201152501056?text=مرحبا،%20أريد%20الاستفسار%20عن%20خدماتكم" class="m-cta" id="mCta" target="_blank" rel="noopener">يلا نتكلم</a>
</div>

<div id="pageRoot" style="padding-top:72px">
  <div class="page-loading" id="loadingEl">
    <div class="spin"></div>
    <div class="loading-text">جاري التحميل...</div>
  </div>
</div>

<footer>
  <div class="ft-copy" id="ftCopy">© 2025 Ahmed Omani Auto Marketing. جميع الحقوق محفوظة.</div>
  <div class="ft-mark">القاهرة — مصر</div>
</footer>

<script>
var SB_URL='https://lhunamvderddsplishtg.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxodW5hbXZkZXJkZHNwbGlzaHRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1OTEzNzMsImV4cCI6MjA5ODE2NzM3M30.AUjhZ4Qtw3hfX-HCIlsdAJpzSutW-GxjQ0D9S11W0vw';
var _waNum='201152501056';
var sb=null;
(function(){
  try{
    var qp=new URLSearchParams(location.search);
    if(qp.has('notrack')){
      if(qp.get('notrack')==='0')localStorage.removeItem('ao_no_track');
      else localStorage.setItem('ao_no_track','1');
    }
  }catch(e){}
})();
function logEvent(type,productId){
  try{
    if(!sb)return;
    if(localStorage.getItem('ao_no_track')==='1')return;
    sb.from('ao_analytics_events').insert({event_type:type,product_id:productId||null,page:'page'}).then(function(){},function(){});
  }catch(e){}
}
function logVisitOnce(){
  try{
    if(sessionStorage.getItem('ao_visit_logged'))return;
    sessionStorage.setItem('ao_visit_logged','1');
    logEvent('visit',null);
  }catch(e){}
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toggleMenu(){
  document.getElementById('burger').classList.toggle('open');
  document.getElementById('mobileNav').classList.toggle('open');
}
function closeMenu(){
  document.getElementById('burger').classList.remove('open');
  document.getElementById('mobileNav').classList.remove('open');
}

function show404(){
  document.getElementById('pageRoot').innerHTML=
    '<div class="page-404">'
    +'<div class="err-code">404</div>'
    +'<div class="err-title">الصفحة غير موجودة</div>'
    +'<div class="err-sub">الصفحة المطلوبة غير موجودة أو غير منشورة بعد</div>'
    +'<a href="/" class="btn-back">← عودة للرئيسية</a>'
    +'</div>';
  document.title='404 — Ahmed Omani';
}

function renderSection(sec){
  switch(sec.type){
    case 'hero': return renderHeroSec(sec);
    case 'text': return renderTextSec(sec);
    case 'cta':  return renderCtaSec(sec);
    default: return '';
  }
}

function renderHeroSec(s){
  var d=s.data||s;
  var btnHref=d.btn_href||d.btn_link||'';
  var isWa=btnHref==='whatsapp';
  var badge=d.badge?'<div class="sec-hero-badge"><span class="sec-hero-badge-dot"></span>'+esc(d.badge)+'</div>':'';
  var subtitle=d.subtitle?'<p>'+esc(d.subtitle)+'</p>':'';
  var btnHtml='';
  if(d.btn_text&&btnHref){
    var href=esc(isWa?'https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار'):btnHref);
    var icon=isWa?'<i class="bi bi-whatsapp"></i>':'';
    btnHtml='<a href="'+href+'" class="btn-r"'+(isWa||btnHref.indexOf('http')===0?' target="_blank" rel="noopener"':'')+'>'
      +icon+esc(d.btn_text)+'</a>';
  }
  return'<section class="sec-hero">'
    +'<div class="container"><div class="sec-hero-content">'
    +badge
    +'<h1>'+esc(d.title||'')+'</h1>'
    +subtitle
    +btnHtml
    +'</div></div>'
    +'</section>';
}

function renderTextSec(s){
  var d=s.data||s;
  return'<section class="sec-text">'
    +'<div class="container"><div class="sec-text-inner">'
    +(d.title?'<div class="sec-text-kicker"></div><h2>'+esc(d.title)+'</h2>':'')
    +'<div class="body-content">'+parseBody(d.body||d.content||'')+'</div>'
    +'</div></div></section>';
}

function renderCtaSec(s){
  var d=s.data||s;
  var btnHref=d.btn_href||d.btn_link||'';
  var isMainWa=btnHref==='whatsapp';
  var waBtn='<a href="https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار')+'" class="btn-wa" target="_blank" rel="noopener"><i class="bi bi-whatsapp"></i>واتساب مباشر</a>';
  var mainBtn='';
  if(d.btn_text&&btnHref){
    var href=esc(isMainWa?'https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار'):btnHref);
    var icon=isMainWa?'<i class="bi bi-whatsapp"></i>':'';
    mainBtn='<a href="'+href+'" class="btn-r"'+(isMainWa||btnHref.indexOf('http')===0?' target="_blank" rel="noopener"':'')+'>'
      +icon+esc(d.btn_text)+'</a>';
  }
  var btnsHtml=mainBtn?(mainBtn+(isMainWa?'':waBtn)):('<a href="/" class="btn-r">اكتشف خدماتنا</a>'+waBtn);
  return'<section class="sec-cta">'
    +'<div class="container"><div class="sec-cta-inner">'
    +(d.title?'<h2>'+esc(d.title)+'</h2>':'')
    +(d.subtitle?'<p>'+esc(d.subtitle)+'</p>':'')
    +'<div class="sec-cta-btns">'+btnsHtml+'</div>'
    +'</div></div></section>';
}

function parseBody(body){
  if(!body)return'';
  if(body.trim().startsWith('<'))return body;
  return body.split(/\n\n+/).map(function(p){
    return'<p>'+esc(p.trim()).replace(/\n/g,'<br>')+'</p>';
  }).join('');
}

async function loadPage(){
  var params=new URLSearchParams(window.location.search);
  var slug=params.get('slug');
  if(!slug){show404();return;}

  try{
    if(typeof supabase==='undefined'){show404();return;}
    sb=supabase.createClient(SB_URL,SB_KEY);
    logVisitOnce();

    var results=await Promise.all([
      sb.from('ao_settings').select('whatsapp,logo_url,favicon_url,footer_text').single(),
      sb.from('ao_pages').select('*').eq('slug',slug).eq('is_published',true).single(),
    ]);
    var cfg=results[0].data;
    if(cfg&&cfg.whatsapp)_waNum=cfg.whatsapp;
    var waHref='https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار عن خدماتكم');
    document.querySelectorAll('#navCta,#mCta').forEach(function(a){a.href=waHref});
    if(cfg&&cfg.logo_url){var nl=document.getElementById('navLogoImg');if(nl)nl.src=cfg.logo_url;}
    if(cfg&&cfg.favicon_url){var fav=document.getElementById('faviconLink');if(fav)fav.href=cfg.favicon_url;}
    if(cfg&&cfg.footer_text){var fc=document.getElementById('ftCopy');if(fc)fc.textContent=cfg.footer_text;}

    var pg=results[1].data;
    if(!pg){show404();return;}

    document.title=pg.title+' — Ahmed Omani';
    document.getElementById('pageTitle').textContent=pg.title+' — Ahmed Omani';
    if(pg.meta_description)document.getElementById('metaDesc').content=pg.meta_description;

    var sections=(pg.sections||[]).map(renderSection).join('');
    document.getElementById('pageRoot').innerHTML=sections||'<div style="padding:140px 5%;text-align:center;color:var(--ink3)">لا يوجد محتوى بعد</div>';
    initReveal();

  }catch(e){
    show404();
  }
}

// ── MOTION — same IntersectionObserver reveal engine as index.html ──
var revealObs;
function initReveal(){
  document.querySelectorAll('.sec-hero-content,.sec-text-inner,.sec-cta-inner').forEach(function(el){el.classList.add('fade-up')});
  if(!revealObs){
    revealObs=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){e.target.classList.add('visible');revealObs.unobserve(e.target)}
      });
    },{threshold:.12,rootMargin:'0px 0px -30px 0px'});
  }
  document.querySelectorAll('.fade-up').forEach(function(el){
    if(el.dataset.revealBound)return;
    el.dataset.revealBound='1';
    revealObs.observe(el);
  });
}

document.addEventListener('DOMContentLoaded',loadPage);
</script>
</body>
