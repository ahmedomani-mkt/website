<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" id="metaDesc" content="">
<title id="pageTitle">Ahmed Omani</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0A0A0C; --surface:#131316; --surface2:#1A1A1F;
  --border:#222227; --border2:#2C2C33;
  --red:#E8192C; --red-d:#C4101F; --red-soft:rgba(232,25,44,.12);
  --txt:#F5F5F7; --txt2:#9B9BA6; --txt3:#65656F;
  --wa:#25D366;
  --font:'Rubik','Segoe UI',Tahoma,Arial,sans-serif;
  --r:18px; --rs:12px; --rp:999px;
  --pad:clamp(20px,4vw,56px);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--txt);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--red);color:#fff}
.container{max-width:1180px;margin:0 auto;padding:0 var(--pad);width:100%}

/* NAV */
nav{position:fixed;top:0;width:100%;z-index:200;height:72px;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,12,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.logo-wrap{display:flex;align-items:center;gap:11px}
.logo-img{height:34px;width:34px;object-fit:contain}
.logo-text .name{font-size:14px;font-weight:900;letter-spacing:.2px;line-height:1.2}
.logo-text .sub{font-size:10px;color:var(--red);font-weight:700;letter-spacing:1.5px}
.nav-home{color:var(--txt2);font-size:13px;font-weight:700;transition:.2s;padding:10px 18px;border:1px solid var(--border2);border-radius:var(--rp)}
.nav-home:hover{color:#fff;background:var(--red);border-color:var(--red)}

/* LOADING */
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:20px}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--txt3);font-size:13px}

/* 404 */
.page-404{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;gap:16px;padding:0 5%}
.err-code{font-size:clamp(64px,12vw,110px);font-weight:900;color:var(--red);line-height:1}
.err-title{font-size:20px;font-weight:800}
.err-sub{font-size:13px;color:var(--txt3);margin-bottom:8px}
.btn-back{background:var(--red);color:#fff;padding:14px 30px;border-radius:var(--rp);font-weight:800;font-size:14px;transition:.2s;display:inline-block}
.btn-back:hover{background:var(--red-d)}

/* SECTION: HERO */
.sec-hero{padding:150px 0 72px;text-align:center}
.sec-hero-content{max-width:720px;margin:0 auto}
.sec-hero-badge{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border2);color:var(--txt2);padding:8px 18px;border-radius:var(--rp);font-size:12px;font-weight:600;margin-bottom:24px}
.sec-hero-badge::before{content:'';width:7px;height:7px;background:var(--red);border-radius:50%;display:inline-block;flex-shrink:0}
.sec-hero h1{font-size:clamp(30px,5vw,48px);font-weight:900;line-height:1.3;margin-bottom:18px}
.sec-hero p{font-size:15px;color:var(--txt2);line-height:1.9;margin-bottom:32px}
.sec-hero .btn-r{background:var(--red);color:#fff;padding:15px 32px;border-radius:var(--rp);font-weight:800;font-size:14px;transition:.2s;display:inline-block}
.sec-hero .btn-r:hover{background:var(--red-d)}

/* SECTION: TEXT */
.sec-text{padding:clamp(48px,7vw,80px) 0}
.sec-text-inner{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:clamp(28px,4vw,48px)}
.sec-text h2{font-size:clamp(22px,3.5vw,32px);font-weight:900;line-height:1.3;margin-bottom:18px}
.sec-text .body-content{font-size:15px;color:var(--txt2);line-height:2}
.sec-text .body-content p{margin-bottom:16px}
.sec-text .body-content h3{font-size:17px;font-weight:800;color:var(--txt);margin:24px 0 10px}
.sec-text .body-content ul{margin:0 22px 16px;color:var(--txt2)}
.sec-text .body-content li{margin-bottom:8px}
.sec-text .body-content strong{color:var(--txt)}

/* SECTION: CTA */
.sec-cta{padding:clamp(48px,7vw,80px) 0}
.sec-cta-inner{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:clamp(32px,5vw,56px);max-width:720px;margin:0 auto;text-align:center}
.sec-cta h2{font-size:clamp(22px,3.5vw,32px);font-weight:900;margin-bottom:12px;line-height:1.3}
.sec-cta p{font-size:14px;color:var(--txt2);margin-bottom:28px;line-height:1.8}
.sec-cta-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn-r{background:var(--red);color:#fff;padding:15px 30px;border-radius:var(--rp);font-weight:800;font-size:14px;transition:.2s;display:inline-block;border:none;cursor:pointer;font-family:var(--font)}
.btn-r:hover{background:var(--red-d)}
.btn-wa{background:var(--surface2);color:var(--txt);border:1px solid var(--border2);padding:15px 30px;border-radius:var(--rp);font-weight:700;font-size:14px;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-wa:hover{border-color:var(--wa);color:var(--wa)}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:24px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:auto}
.ft-copy{font-size:12px;color:var(--txt3)}
.ft-mark{font-size:12px;color:var(--txt3)}
</style>
</head>
<body>

<nav>
  <a href="/" class="logo-wrap">
    <img src="assets/logo.svg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27%23E8192C%27/%3E%3Cpolygon points=%2750,22 78,68 22,68%27 fill=%27white%27/%3E%3C/svg%3E'" alt="Ahmed Omani Logo" class="logo-img">
    <div class="logo-text">
      <div class="name">AHMED OMANI</div>
      <div class="sub">Auto Marketing</div>
    </div>
  </a>
  <a href="/" class="nav-home">← الرئيسية</a>
</nav>

<div id="pageRoot" style="padding-top:72px">
  <div class="page-loading" id="loadingEl">
    <div class="spin"></div>
    <div class="loading-text">جاري التحميل...</div>
  </div>
</div>

<footer>
  <div class="ft-copy">© 2025 Ahmed Omani Auto Marketing. جميع الحقوق محفوظة.</div>
  <div class="ft-mark">القاهرة — مصر</div>
</footer>

<script>
var SB_URL='https://knwnviglquxvvwknxbqa.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtud252aWdscXV4dnZ3a254YnFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MzI2NDIsImV4cCI6MjA5NjUwODY0Mn0.VuxAC-J7it4m_wrSTBHCh7t_z_PL8CCGwhvtv6NiZmQ';
var _waNum='201152501056';

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function show404(){
  document.getElementById('pageRoot').innerHTML=
    '<div class="page-404">'
    +'<div class="err-code">404</div>'
    +'<div class="err-title">الصفحة غير موجودة</div>'
    +'<div class="err-sub">الصفحة المطلوبة غير موجودة أو غير منشورة بعد</div>'
    +'<a href="/" class="btn-back">← عودة للرئيسية</a>'
    +'</div>';
  document.title='404 — Ahmed Omani';
}

function renderSection(sec){
  switch(sec.type){
    case 'hero': return renderHeroSec(sec);
    case 'text': return renderTextSec(sec);
    case 'cta':  return renderCtaSec(sec);
    default: return '';
  }
}

function renderHeroSec(s){
  var d=s.data||s;
  var btnHref=d.btn_href||d.btn_link||'';
  var badge=d.badge?'<div class="sec-hero-badge">'+esc(d.badge)+'</div>':'';
  var subtitle=d.subtitle?'<p>'+esc(d.subtitle)+'</p>':'';
  var btnHtml='';
  if(d.btn_text&&btnHref){
    var href=esc(btnHref==='whatsapp'?'https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار'):btnHref);
    btnHtml='<a href="'+href+'" class="btn-r"'+(btnHref.startsWith('http')?' target="_blank" rel="noopener"':'')+'>'
      +esc(d.btn_text)+'</a>';
  }
  return'<section class="sec-hero">'
    +'<div class="container"><div class="sec-hero-content">'
    +badge
    +'<h1>'+esc(d.title||'')+'</h1>'
    +subtitle
    +btnHtml
    +'</div></div>'
    +'</section>';
}

function renderTextSec(s){
  var d=s.data||s;
  return'<section class="sec-text">'
    +'<div class="container"><div class="sec-text-inner">'
    +(d.title?'<h2>'+esc(d.title)+'</h2>':'')
    +'<div class="body-content">'+parseBody(d.body||d.content||'')+'</div>'
    +'</div></div></section>';
}

function renderCtaSec(s){
  var d=s.data||s;
  var btnHref=d.btn_href||d.btn_link||'';
  var waBtn='<a href="https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار')+'" class="btn-wa" target="_blank" rel="noopener">واتساب مباشر</a>';
  var mainBtn='';
  if(d.btn_text&&btnHref){
    var href=esc(btnHref==='whatsapp'?'https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار'):btnHref);
    mainBtn='<a href="'+href+'" class="btn-r"'+(btnHref.startsWith('http')?' target="_blank" rel="noopener"':'')+'>'
      +esc(d.btn_text)+'</a>';
  }
  return'<section class="sec-cta">'
    +'<div class="container"><div class="sec-cta-inner">'
    +(d.title?'<h2>'+esc(d.title)+'</h2>':'')
    +(d.subtitle?'<p>'+esc(d.subtitle)+'</p>':'')
    +'<div class="sec-cta-btns">'+(mainBtn||'<a href="/" class="btn-r">اكتشف خدماتنا</a>')+waBtn+'</div>'
    +'</div></div></section>';
}

function parseBody(body){
  if(!body)return'';
  if(body.trim().startsWith('<'))return body;
  return body.split(/\n\n+/).map(function(p){
    return'<p>'+esc(p.trim()).replace(/\n/g,'<br>')+'</p>';
  }).join('');
}

async function loadPage(){
  var params=new URLSearchParams(window.location.search);
  var slug=params.get('slug');
  if(!slug){show404();return;}

  try{
    if(typeof supabase==='undefined'){show404();return;}
    var sb=supabase.createClient(SB_URL,SB_KEY);

    var cfg=(await sb.from('ao_settings').select('whatsapp').single()).data;
    if(cfg&&cfg.whatsapp)_waNum=cfg.whatsapp;

    var res=await sb.from('ao_pages').select('*').eq('slug',slug).eq('is_published',true).single();
    var pg=res.data;
    if(!pg){show404();return;}

    document.title=pg.title+' — Ahmed Omani';
    document.getElementById('pageTitle').textContent=pg.title+' — Ahmed Omani';
    if(pg.meta_description)document.getElementById('metaDesc').content=pg.meta_description;

    var sections=(pg.sections||[]).map(renderSection).join('');
    document.getElementById('pageRoot').innerHTML=sections||'<div style="padding:140px 5%;text-align:center;color:#65656F">لا يوجد محتوى بعد</div>';

  }catch(e){
    show404();
  }
}

document.addEventListener('DOMContentLoaded',loadPage);
</script>
</body>
</html>
