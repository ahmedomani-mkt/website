<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" id="metaDesc" content="">
<title id="pageTitle">Ahmed Omani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#E8192C;--red-d:#B5101E;--red-glow:rgba(232,25,44,.12);--red-dim:#150305;
  --black:#080808;--dk:#0f0f0f;--card:#141414;--card2:#1a1a1a;
  --border:#1e1e1e;--border2:#252525;--white:#fff;--gray:#888;
  --font:'Noto Kufi Arabic','Segoe UI',Tahoma,Arial,sans-serif;--r:12px;--rsm:8px;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--black);color:var(--white);overflow-x:hidden;min-height:100vh}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.container{max-width:1180px;margin:0 auto;padding:0 5%}

/* NAV */
nav{position:fixed;top:0;width:100%;z-index:200;height:62px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;background:rgba(8,8,8,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.logo-wrap{display:flex;align-items:center;gap:12px}
.logo-img{height:40px;width:40px;object-fit:contain}
.logo-text .name{font-size:15px;font-weight:900}
.logo-text .sub{font-size:9px;color:var(--red);font-weight:700;letter-spacing:2.5px;text-transform:uppercase}
.nav-home{color:#999;font-size:13px;font-weight:600;transition:.2s;padding:8px 18px;border:1px solid var(--border);border-radius:var(--rsm)}
.nav-home:hover{color:var(--white);border-color:#333}

/* LOADING */
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px}
.spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--gray);font-size:14px}

/* 404 */
.page-404{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;gap:16px}
.err-code{font-size:80px;font-weight:900;color:var(--red);line-height:1}
.err-title{font-size:22px;font-weight:700}
.err-sub{font-size:14px;color:var(--gray);margin-bottom:8px}
.btn-back{background:var(--red);color:#fff;padding:12px 28px;border-radius:var(--rsm);font-weight:700;font-size:14px;transition:.2s;display:inline-block}
.btn-back:hover{background:var(--red-d)}

/* SECTION: HERO */
.sec-hero{min-height:80vh;display:flex;align-items:center;padding:100px 0 80px;position:relative;overflow:hidden;text-align:center}
.sec-hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 40%,rgba(232,25,44,.08) 0%,transparent 70%);pointer-events:none}
.sec-hero-content{position:relative;z-index:1;width:100%}
.sec-hero-badge{display:inline-block;background:var(--red-dim);border:1px solid rgba(232,25,44,.25);color:var(--red);padding:6px 18px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px}
.sec-hero h1{font-size:clamp(30px,5vw,60px);font-weight:900;line-height:1.2;margin-bottom:18px}
.sec-hero p{font-size:16px;color:#999;max-width:560px;margin:0 auto 36px;line-height:1.9}
.sec-hero .btn-r{background:var(--red);color:#fff;padding:13px 32px;border-radius:var(--rsm);font-weight:700;font-size:14px;transition:.2s;display:inline-block}
.sec-hero .btn-r:hover{background:var(--red-d);transform:translateY(-2px)}

/* SECTION: TEXT */
.sec-text{padding:80px 0}
.sec-text-inner{max-width:800px;margin:0 auto}
.sec-text h2{font-size:clamp(24px,4vw,40px);font-weight:900;line-height:1.2;margin-bottom:20px}
.sec-text .body-content{font-size:15px;color:#ccc;line-height:1.9}
.sec-text .body-content p{margin-bottom:14px}
.sec-text .body-content h3{font-size:18px;font-weight:700;color:var(--white);margin:24px 0 10px}
.sec-text .body-content ul{margin:0 20px 14px;color:#bbb}
.sec-text .body-content li{margin-bottom:6px}
.sec-text .body-content strong{color:var(--white)}

/* SECTION: CTA */
.sec-cta{padding:80px 0;background:var(--dk)}
.sec-cta-inner{background:radial-gradient(ellipse at 50% 0%,rgba(232,25,44,.1),transparent 70%);border:1px solid rgba(232,25,44,.15);border-radius:var(--r);padding:60px 40px;text-align:center;max-width:700px;margin:0 auto}
.sec-cta h2{font-size:clamp(24px,4vw,38px);font-weight:900;margin-bottom:14px}
.sec-cta p{font-size:15px;color:var(--gray);margin-bottom:32px;line-height:1.8}
.sec-cta-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn-r{background:var(--red);color:#fff;padding:13px 28px;border-radius:var(--rsm);font-weight:700;font-size:14px;transition:.2s;display:inline-block;border:none;cursor:pointer;font-family:var(--font)}
.btn-r:hover{background:var(--red-d);transform:translateY(-2px)}
.btn-wa{background:#25D366;color:#fff;padding:13px 28px;border-radius:var(--rsm);font-weight:700;font-size:14px;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-wa:hover{background:#1dba58;transform:translateY(-2px)}

/* FOOTER */
footer{background:var(--dk);border-top:1px solid var(--border);padding:28px 5%;text-align:center;margin-top:auto}
.ft-copy{font-size:11px;color:#2a2a2a}
</style>
</head>
<body>

<nav>
  <a href="/" class="logo-wrap">
    <img src="assets/logo.svg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2748%27 fill=%27white%27/%3E%3Cpolygon points=%2750,20 80,70 20,70%27 fill=%27black%27/%3E%3Crect x=%2744%27 y=%2768%27 width=%2712%27 height=%2712%27 fill=%27%23E8192C%27/%3E%3C/svg%3E'" alt="Ahmed Omani Logo" class="logo-img">
    <div class="logo-text">
      <div class="name">AHMED OMANI</div>
      <div class="sub">Auto Marketing</div>
    </div>
  </a>
  <a href="/" class="nav-home">← الرئيسية</a>
</nav>

<div id="pageRoot" style="padding-top:62px;min-height:calc(100vh - 62px)">
  <div class="page-loading" id="loadingEl">
    <div class="spin"></div>
    <div class="loading-text">جاري التحميل...</div>
  </div>
</div>

<footer>
  <div class="ft-copy">© 2025 Ahmed Omani Auto Marketing. جميع الحقوق محفوظة.</div>
</footer>

<script>
var SB_URL='https://knwnviglquxvvwknxbqa.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtud252aWdscXV4dnZ3a254YnFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MzI2NDIsImV4cCI6MjA5NjUwODY0Mn0.VuxAC-J7it4m_wrSTBHCh7t_z_PL8CCGwhvtv6NiZmQ';
var _waNum='201000000000';

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function show404(){
  document.getElementById('pageRoot').innerHTML=
    '<div class="page-404">'
    +'<div class="err-code">404</div>'
    +'<div class="err-title">الصفحة غير موجودة</div>'
    +'<div class="err-sub">الصفحة المطلوبة غير موجودة أو غير منشورة بعد</div>'
    +'<a href="/" class="btn-back">← عودة للرئيسية</a>'
    +'</div>';
  document.title='404 — Ahmed Omani';
}

function renderSection(sec){
  switch(sec.type){
    case 'hero': return renderHeroSec(sec);
    case 'text': return renderTextSec(sec);
    case 'cta':  return renderCtaSec(sec);
    default: return '';
  }
}

function renderHeroSec(s){
  var badge=s.badge?'<div class="sec-hero-badge">'+esc(s.badge)+'</div>':'';
  var subtitle=s.subtitle?'<p>'+esc(s.subtitle)+'</p>':'';
  var btnHtml='';
  if(s.btn_text&&s.btn_href){
    var href=esc(s.btn_href==='whatsapp'?'https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار'):s.btn_href);
    btnHtml='<a href="'+href+'" class="btn-r"'+(s.btn_href.startsWith('http')?' target="_blank" rel="noopener"':'')+'>'
      +esc(s.btn_text)+'</a>';
  }
  return'<section class="sec-hero">'
    +'<div class="sec-hero-bg"></div>'
    +'<div class="container"><div class="sec-hero-content">'
    +badge
    +'<h1>'+esc(s.title||'')+'</h1>'
    +subtitle
    +btnHtml
    +'</div></div></section>';
}

function renderTextSec(s){
  return'<section class="sec-text">'
    +'<div class="container"><div class="sec-text-inner">'
    +(s.title?'<h2>'+esc(s.title)+'</h2>':'')
    +'<div class="body-content">'+parseBody(s.body||'')+'</div>'
    +'</div></div></section>';
}

function renderCtaSec(s){
  var waBtn='<a href="https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار')+'" class="btn-wa" target="_blank" rel="noopener">💬 واتساب مباشر</a>';
  var mainBtn='';
  if(s.btn_text&&s.btn_href){
    var href=esc(s.btn_href==='whatsapp'?'https://wa.me/'+_waNum+'?text='+encodeURIComponent('مرحبا، أريد الاستفسار'):s.btn_href);
    mainBtn='<a href="'+href+'" class="btn-r"'+(s.btn_href.startsWith('http')?' target="_blank" rel="noopener"':'')+'>'
      +esc(s.btn_text)+'</a>';
  }
  return'<section class="sec-cta">'
    +'<div class="container"><div class="sec-cta-inner">'
    +(s.title?'<h2>'+esc(s.title)+'</h2>':'')
    +(s.subtitle?'<p>'+esc(s.subtitle)+'</p>':'')
    +'<div class="sec-cta-btns">'+(mainBtn||'<a href="/" class="btn-r">اكتشف خدماتنا</a>')+waBtn+'</div>'
    +'</div></div></section>';
}

function parseBody(body){
  // Convert plain text with \n to paragraphs; allow raw HTML passthrough if starts with <
  if(!body)return'';
  if(body.trim().startsWith('<'))return body;
  return body.split(/\n\n+/).map(function(p){
    return'<p>'+esc(p.trim()).replace(/\n/g,'<br>')+'</p>';
  }).join('');
}

async function loadPage(){
  var params=new URLSearchParams(window.location.search);
  var slug=params.get('slug');
  if(!slug){show404();return;}

  try{
    if(typeof supabase==='undefined'){show404();return;}
    var sb=supabase.createClient(SB_URL,SB_KEY);

    var cfg=(await sb.from('ao_settings').select('whatsapp').single()).data;
    if(cfg&&cfg.whatsapp)_waNum=cfg.whatsapp;

    var res=await sb.from('ao_pages').select('*').eq('slug',slug).eq('is_published',true).single();
    var pg=res.data;
    if(!pg){show404();return;}

    document.title=pg.title+' — Ahmed Omani';
    document.getElementById('pageTitle').textContent=pg.title+' — Ahmed Omani';
    if(pg.meta_description)document.getElementById('metaDesc').content=pg.meta_description;

    var sections=(pg.sections||[]).map(renderSection).join('');
    document.getElementById('pageRoot').innerHTML=sections||'<div style="padding:120px 5%;text-align:center;color:#888">لا يوجد محتوى بعد</div>';

  }catch(e){
    show404();
  }
}

document.addEventListener('DOMContentLoaded',loadPage);
</script>
</body>
</html>
