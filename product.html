<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --p1:#0A0A0C; --p2:#131316; --p3:#1C1C21;
  --ink:#F5F5F8; --ink2:rgba(245,245,248,.68); --ink3:rgba(245,245,248,.46);
  --line:rgba(245,245,248,.16); --line2:rgba(245,245,248,.26);
  --red:#E8192C; --red-d:#ff3b4e; --red-soft:rgba(232,25,44,.18);
  --wa:#25D366; --wa-d:#2ee578;
  --card-bg:linear-gradient(155deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 55%);
  --glass-blur:blur(28px) saturate(180%);
  --glass-border:rgba(255,255,255,.28);
  --glass-shadow:inset 0 1.5px 0 rgba(255,255,255,.3), inset 0 0 0 1px rgba(255,255,255,.06), 0 24px 50px -16px rgba(0,0,0,.6);
  --font:'Rubik','Segoe UI',Tahoma,Arial,sans-serif;
  --r:22px; --rs:14px; --rp:999px;
  --pad:clamp(20px,4vw,56px);
}
:root[data-theme="light"]{
  --p1:#F6F6F8; --p2:#EFEFF3; --p3:#E6E6EC;
  --ink:#14141A; --ink2:rgba(20,20,26,.64); --ink3:rgba(20,20,26,.42);
  --line:rgba(20,20,26,.12); --line2:rgba(20,20,26,.2);
  --red-d:#c4101f; --red-soft:rgba(232,25,44,.1);
  --wa-d:#1dba58;
  --card-bg:linear-gradient(155deg,rgba(255,255,255,.8),rgba(255,255,255,.4) 55%);
  --glass-border:rgba(20,20,26,.14);
  --glass-shadow:inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.5), 0 20px 44px -18px rgba(20,20,26,.2);
}
.ambient-glow{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--p1)}
.ambient-glow.has-image{background-size:cover;background-position:center}
.ambient-glow.has-image::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,7,.72),rgba(5,5,7,.86));z-index:1}
.ambient-glow span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:glowBreathe 14s ease-in-out infinite;z-index:2}
.ambient-glow span:nth-child(1){width:52vw;height:52vw;top:-14%;right:-10%;background:radial-gradient(circle,rgba(232,25,44,.65),transparent 70%);animation-delay:0s}
.ambient-glow span:nth-child(2){width:42vw;height:42vw;top:22%;left:-14%;background:radial-gradient(circle,rgba(255,70,70,.5),transparent 70%);animation-delay:-4s}
.ambient-glow span:nth-child(3){width:46vw;height:46vw;bottom:-16%;right:8%;background:radial-gradient(circle,rgba(120,10,25,.6),transparent 70%);animation-delay:-8s}
.ambient-glow span:nth-child(4){width:34vw;height:34vw;bottom:10%;left:6%;background:radial-gradient(circle,rgba(196,16,31,.45),transparent 70%);animation-delay:-11s}
@keyframes glowBreathe{0%,100%{transform:scale(1) translate(0,0);opacity:.5}50%{transform:scale(1.15) translate(2%,-2%);opacity:.7}}
@media(prefers-reduced-motion:reduce){.ambient-glow span{animation:none}}
:root[data-theme="light"] .ambient-glow span{opacity:.32}
:root[data-theme="light"] .ambient-glow span:nth-child(1){background:radial-gradient(circle,rgba(232,25,44,.35),transparent 70%)}
:root[data-theme="light"] .ambient-glow span:nth-child(2){background:radial-gradient(circle,rgba(255,120,120,.3),transparent 70%)}
:root[data-theme="light"] .ambient-glow span:nth-child(3){background:radial-gradient(circle,rgba(196,16,31,.22),transparent 70%)}
:root[data-theme="light"] .ambient-glow span:nth-child(4){background:radial-gradient(circle,rgba(255,150,150,.26),transparent 70%)}
:root[data-theme="light"] .ambient-glow.has-image::after{background:linear-gradient(180deg,rgba(255,255,255,.68),rgba(255,255,255,.85))}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--p1);color:var(--ink);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
button{font-family:var(--font);cursor:pointer}
::selection{background:var(--red);color:#fff}
.container{max-width:1180px;margin:0 auto;padding:0 var(--pad);width:100%}

/* NAV */
nav{position:fixed;top:0;width:100%;z-index:200;height:72px;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,12,.68);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--line)}
:root[data-theme="light"] nav{background:rgba(255,255,255,.6)}
.logo-wrap{display:flex;align-items:center}
.logo-img{height:40px;width:auto;max-width:180px;object-fit:contain}
.nav-side{display:flex;align-items:center;gap:10px}
.nav-back{color:var(--ink2);font-size:13px;font-weight:600;transition:.2s;padding:10px 18px;border:1px solid var(--line2);border-radius:var(--rp);display:flex;align-items:center;gap:7px}
.nav-back:hover{color:#fff;background:var(--red);border-color:var(--red)}
.cart-btn{position:relative;display:flex;align-items:center;gap:9px;background:var(--red);color:#fff;border:none;padding:11px 20px;border-radius:var(--rp);font-weight:600;font-size:13px;transition:.2s;box-shadow:0 6px 22px rgba(232,25,44,.4)}
.cart-btn:hover{background:var(--red-d);box-shadow:0 8px 28px rgba(232,25,44,.55)}
.cart-count{background:#fff;color:var(--red);min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;padding:0 5px}

/* LOADING / NOT FOUND */
.pd-status{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:150px 20px 60px;text-align:center}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pd-status p{color:var(--ink3);font-size:13px}
.pd-status h2{font-size:20px;color:var(--ink);font-weight:700}

/* BREADCRUMB */
.pd-crumb{padding:96px 0 0}
.pd-crumb-inner{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3);font-weight:500}
.pd-crumb-inner a{color:var(--ink2);transition:.2s}
.pd-crumb-inner a:hover{color:var(--red)}

/* HERO */
.pd-hero{padding:24px 0 clamp(48px,6vw,72px)}
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,4vw,56px);align-items:flex-start}
.pd-media{position:sticky;top:96px}
.pd-img{border-radius:var(--r);overflow:hidden;aspect-ratio:1/1;border:1px solid var(--line);background:linear-gradient(160deg,var(--p2),var(--p3));display:flex;align-items:center;justify-content:center}
.pd-img img{width:100%;height:100%;object-fit:cover}
.pd-img-ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink3)}
.pd-img-ph i{font-size:44px;color:var(--red)}
.pd-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pd-thumb{width:64px;height:64px;border-radius:10px;overflow:hidden;border:2px solid var(--line);cursor:pointer;background:var(--p3);flex-shrink:0;padding:0}
.pd-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pd-thumb.active{border-color:var(--red)}
.pd-cat{display:inline-block;background:var(--red-soft);color:var(--red);padding:6px 16px;border-radius:var(--rp);font-size:11.5px;font-weight:700;margin-bottom:16px}
.pd-title{font-size:clamp(24px,3vw,32px);font-weight:700;line-height:1.35;margin-bottom:14px;color:var(--ink)}
.pd-desc{font-size:14px;color:var(--ink2);line-height:1.85;margin-bottom:22px;font-weight:400}
.pd-price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:26px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.pd-price{font-size:26px;font-weight:700;color:var(--ink)}
.pd-price-note{font-size:12.5px;color:var(--ink3)}
.pd-price.ask{font-size:15px;color:var(--ink2);font-weight:600}
.pd-ctas{display:flex;flex-direction:column;gap:10px}
.pd-wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--wa);color:#fff;border:none;border-radius:var(--rp);padding:16px;font-weight:600;font-size:14px;transition:.2s;box-shadow:0 8px 26px rgba(37,211,102,.4)}
.pd-wa-btn:hover{background:var(--wa-d);box-shadow:0 10px 32px rgba(37,211,102,.55)}
.pd-wa-btn svg{width:18px;height:18px;flex-shrink:0}
.pd-cart-btn{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--p1);border:1px solid var(--line2);color:var(--ink);border-radius:var(--rp);padding:15px;font-weight:600;font-size:13.5px;transition:.2s}
.pd-cart-btn:hover{background:rgba(255,255,255,.06);border-color:var(--red);color:var(--red)}
.pd-note{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:4px}

/* DETAILS */
.pd-details{padding:0 0 clamp(56px,7vw,88px)}
.pd-details-inner{max-width:600px;background:var(--p2);border:1px solid var(--line);border-radius:var(--r);padding:clamp(24px,3vw,32px)}
.pd-details-title{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--ink)}
.pd-details ul{list-style:none;display:flex;flex-direction:column;gap:12px}
.pd-details li{display:flex;align-items:flex-start;gap:11px;font-size:13.5px;color:var(--ink2);line-height:1.7}
.pd-details li i{color:var(--red);font-size:15px;margin-top:2px;flex-shrink:0}

/* MORE PRODUCTS CTA */
.pd-more{padding:0 0 clamp(64px,8vw,100px);text-align:center}
.pd-more a{display:inline-flex;align-items:center;gap:9px;background:var(--p1);border:1px solid var(--line2);color:var(--ink);padding:14px 28px;border-radius:var(--rp);font-weight:600;font-size:13.5px;transition:.2s}
.pd-more a:hover{background:var(--red);border-color:var(--red);color:#fff}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);background:rgba(28,25,22,.92);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--line2);color:#fff;padding:12px 24px;border-radius:var(--rp);font-size:13px;z-index:999;transition:.3s;opacity:0;pointer-events:none}
:root[data-theme="light"] .toast{background:rgba(255,255,255,.92);border-color:rgba(20,20,26,.12);color:var(--ink)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* FOOTER */
footer{border-top:1px solid var(--line);padding:24px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:auto;background:var(--p2)}
.ft-copy{font-size:12px;color:var(--ink3)}
.ft-mark{font-size:12px;color:var(--ink3)}

@media(max-width:900px){
  .pd-grid{grid-template-columns:1fr;gap:24px}
  .pd-media{position:static}
  .pd-img{aspect-ratio:4/3}
}
@media(max-width:600px){
  .cart-btn .cart-btn-txt,.nav-back span{display:none}
}
</style>
</head>

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function applySiteTheme(mode){
  var isLight=mode==='light';
  if(isLight)document.documentElement.dataset.theme='light';
  else delete document.documentElement.dataset.theme;
  try{localStorage.setItem('ao-site-theme',isLight?'light':'dark')}catch(e){}
}
function applySiteBg(url){
  var glow=document.querySelector('.ambient-glow');
  if(!glow||!url)return;
  glow.style.backgroundImage='url('+JSON.stringify(url)+')';
  glow.classList.add('has-image');
}
function catName(c){return catLabels[c]||c||'عام'}
function fmtPrice(p){p=parseFloat(p);if(!p||p<=0)return null;return p.toLocaleString('en-US')+' EGP'}
function toast(msg){
  var t=document.getElementById('toastEl');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2600);
}

function getCartCount(){
  try{
    var c=JSON.parse(localStorage.getItem(CART_KEY))||{};
    return Object.keys(c).reduce(function(s,k){return s+c[k]},0);
  }catch(e){return 0}
}
function updateCartCount(){document.getElementById('cartCount').textContent=getCartCount()}

function addAndGoToCart(){
  if(!product)return;
  var cart={};
  try{cart=JSON.parse(localStorage.getItem(CART_KEY))||{}}catch(e){cart={}}
  cart[product.id]=(cart[product.id]||0)+1;
  localStorage.setItem(CART_KEY,JSON.stringify(cart));
  pxTrack('AddToCart',{content_ids:[product.id],content_name:product.title,content_type:'product',currency:'EGP',value:parseFloat(product.price)||0});
  toast('اتضاف للسلة ✓ هننقلك للكتالوج...');
  setTimeout(function(){window.location.href=catalogPage},700);
}

function setCatalogTarget(catalog){
  catalogPage=catalog==='marketing'?'catalog-marketing.html':'catalog.html';
  CART_KEY=catalog==='marketing'?'ao_cart_marketing_v1':'ao_cart_v1';
  var label=catalog==='marketing'?'كتالوج التسويق':'كتالوج الدعاية والإعلان';
  ['navBackLink','navCartLink','crumbCatLink','moreCatLink'].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.href=catalogPage;
  });
  var lbl=document.getElementById('navBackLabel');
  if(lbl)lbl.textContent=label;
}

function safeTrackId(id){return id&&/^[A-Za-z0-9_-]{1,64}$/.test(id)?id:null}
function injectMetaPixel(id){
  id=safeTrackId(id);if(!id||window.fbq)return;
  var s=document.createElement('script');
  s.innerHTML='!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version=\'2.0\';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,\'script\',\'https://connect.facebook.net/en_US/fbevents.js\');fbq(\'init\',\''+id+'\');fbq(\'track\',\'PageView\');';
  document.head.appendChild(s);
}
function pxTrack(name,params){

function renderGallery(images,title,category){
  var img=document.getElementById('pdImg');
  var thumbs=document.getElementById('pdThumbs');
  if(!images.length){
    document.getElementById('pdImgPh').textContent=catName(category);
    thumbs.innerHTML='';
    return;
  }
  function showAt(i){
    img.innerHTML='<img src="'+esc(images[i])+'" alt="'+esc(title)+'">';
    thumbs.querySelectorAll('.pd-thumb').forEach(function(t,ti){t.classList.toggle('active',ti===i)});
  }
  if(images.length>1){
    thumbs.innerHTML=images.map(function(url,i){
      return'<button type="button" class="pd-thumb'+(i===0?' active':'')+'"><img src="'+esc(url)+'" alt=""></button>';
    }).join('');
    thumbs.querySelectorAll('.pd-thumb').forEach(function(t,i){t.onclick=function(){showAt(i)}});
  }else{
    thumbs.innerHTML='';
  }
  showAt(0);
}

function renderProduct(p){
  product=p;
  setCatalogTarget(p.catalog);
  updateCartCount();
  document.title=p.title+' — Ahmed Omani';
  document.getElementById('pdCrumbTitle').textContent=p.title;
  document.getElementById('pdCat').textContent=catName(p.category);
  document.getElementById('pdTitle').textContent=p.title;
  document.getElementById('pdDesc').textContent=p.description||'';
  var gallery=Array.isArray(p.images)&&p.images.length?p.images:(p.image_url?[p.image_url]:[]);
  renderGallery(gallery,p.title,p.category);
  var price=fmtPrice(p.price);
  if(price){
    document.getElementById('pdPrice').textContent=price;
    document.getElementById('pdPriceNote').textContent=p.price_note||'';
  }else{
    document.getElementById('pdPrice').textContent='السعر عند التواصل';
    document.getElementById('pdPrice').classList.add('ask');
  }
  var prodLabel=p.title+(price?' ('+price+')':'');
  var waMsg=_waInquiryTpl.indexOf('{product}')>-1?_waInquiryTpl.replace('{product}',prodLabel):_waInquiryTpl+' '+prodLabel;
  document.getElementById('pdWaBtn').onclick=function(){
    pxTrack('Contact',{content_ids:[p.id],content_name:p.title,content_type:'product',currency:'EGP',value:parseFloat(p.price)||0});
    window.open('https://wa.me/'+_waNum+'?text='+encodeURIComponent(waMsg),'_blank','noopener');
  };
  if(p.details){
    var lines=p.details.split('\n').map(function(l){return l.trim()}).filter(Boolean);
    if(lines.length){
      document.getElementById('pdDetailsList').innerHTML=lines.map(function(l){
        return'<li><i class="bi bi-check-circle-fill"></i><span>'+esc(l)+'</span></li>';
      }).join('');
      document.getElementById('pdDetailsSec').style.display='block';
    }
  }
  document.getElementById('pdLoading').style.display='none';
  document.getElementById('pdNotFound').style.display='none';
  document.getElementById('pdContent').style.display='block';
  pxTrack('ViewContent',{content_ids:[p.id],content_name:p.title,content_type:'product',currency:'EGP',value:parseFloat(p.price)||0});
}

async function loadProduct(){
  updateCartCount();
  var id=new URLSearchParams(window.location.search).get('id');
  if(!id){showNotFound();return}
  try{
    if(typeof supabase==='undefined')throw new Error('no sb');
    var sb=supabase.createClient(SB_URL,SB_KEY);
    var cfg=(await sb.from('ao_settings').select('whatsapp,wa_full,meta_pixel_id,logo_url,logo_dark_url,favicon_url,site_bg_image,site_theme_mode').single()).data;
    if(cfg&&cfg.whatsapp)_waNum=cfg.whatsapp;
    if(cfg&&cfg.wa_full&&cfg.wa_full.trim())_waInquiryTpl=cfg.wa_full.trim();
    if(cfg&&cfg.meta_pixel_id)injectMetaPixel(cfg.meta_pixel_id);
    if(cfg){var activeLogo=(cfg.site_theme_mode==='light')?cfg.logo_url:(cfg.logo_dark_url||cfg.logo_url);if(activeLogo){var nl=document.getElementById('navLogoImg');if(nl)nl.src=activeLogo;}}
    if(cfg&&cfg.favicon_url){var fav=document.getElementById('faviconLink');if(fav)fav.href=cfg.favicon_url;}
    if(cfg&&cfg.site_bg_image)applySiteBg(cfg.site_bg_image);
    if(cfg)applySiteTheme(cfg.site_theme_mode);
    var res=await sb.from('ao_products').select('*').eq('id',id).eq('is_active',true).single();
    if(res.error||!res.data){showNotFound();return}
    renderProduct(res.data);
  }catch(e){showNotFound()}
}
function showNotFound(){
  document.getElementById('pdLoading').style.display='none';
  document.getElementById('pdNotFound').style.display='flex';
}
document.addEventListener('DOMContentLoaded',loadProduct);
</script>
